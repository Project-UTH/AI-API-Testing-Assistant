spring.application.name=mutant-api
# 8082 da bi docker-compose.app.yml cua ai-recruitment-agent dung nen mutant-api dung 8083.
server.port=${SERVER_PORT:8083}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Endpoint dieu khien mutant (/__mutants, /__reset) CHI co khi bat. Mac dinh TAT de khong ai vo tinh
# mo cong bat loi tren moi truong khac. Khi do: MUTANT_CONTROL=true ./mvnw spring-boot:run
mutant.control=${MUTANT_CONTROL:false}

# Khoa chi dung cho demo noi bo, khong phai bi mat that.
app.jwt.secret=mutant-api-local-only-secret-key-not-for-production-use-0123456789
app.jwt.expiration-ms=86400000
