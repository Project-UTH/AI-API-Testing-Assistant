spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/ai_api_testing_agent?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Gui email OTP cho luong "Quen mat khau" (Module 12) - dien gia tri that vao .env, khong commit
# credential that. Vi du dung Gmail SMTP: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=
# dia chi Gmail, MAIL_PASSWORD=App Password (khong phai mat khau Gmail thuong, phai bat 2-Step
# Verification roi tao App Password rieng). Hoac dung Mailtrap (sandbox, khong gui email that ra
# ngoai, tien loi khi dev/demo) - lay host/port/user/pass tu mailtrap.io.
# Co gia tri mac dinh rong/587 (khac JWT_SECRET/DB_PASSWORD bat buoc) - de app van khoi dong binh
# thuong khi chua cau hinh email, chi that bai LUC GOI sendPasswordResetOtp() neu thieu.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Dang nhap/dang ky bang Google (Module 13) - Google Identity Services, chi verify ID token offline
# nen khong can GOOGLE_CLIENT_SECRET. Gia tri rong mac dinh de app van khoi dong duoc khi chua tao
# OAuth Client ID tren Google Cloud Console - chi /auth/google se loi (tu choi moi token) neu thieu.
google.oauth.client-id=${GOOGLE_CLIENT_ID:}

aes.secret=${AES_SECRET}

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-sonnet-5
# Timeout that su cua client Anthropic (spring.http.client.read-timeout KHONG ap dung cho SDK nay): mac dinh khien sinh test endpoint lon that bai o ~180s
spring.ai.anthropic.timeout=${AI_TIMEOUT:600s}
# Module 15i - 16000 (truoc la 8000): checklist chuan tung loai giao AI toan bo muc, ~24 case x ~350 token dau ra
# Danh gia 2026-10-20: 16000 token dau ra khong du cho endpoint nhieu rang buoc (Boundary ~24+ case) - nang len 32000, chinh duoc bang AI_MAX_TOKENS
spring.ai.anthropic.chat.options.max-tokens=${AI_MAX_TOKENS:32000}

# Quota AI/ngay (Module 11) - tong token toi da 1 user duoc dung trong 1 ngay (UTC) de sinh test
# case, chan SOM truoc khi goi AI (khong ton request nao neu da vuot). 100000 token/ngay du cho
# vai chuc lan sinh binh thuong, nhung chan duoc truong hop 1 user vo tinh/co y sinh lien tuc.
ai.quota.daily-token-limit=${AI_DAILY_TOKEN_LIMIT:500000}
spring.ai.retry.max-attempts=3
spring.http.client.connect-timeout=5s
# Module 15i - 150s (truoc la 30s): AI sinh ~24 case co the mat >100s; van thap hon spring.mvc.async.request-timeout (180s)
# Danh gia 2026-10-20: 150s lam sinh test endpoint lon that bai (AnthropicIoException) - nang len 600s, chinh duoc bang AI_READ_TIMEOUT
spring.http.client.read-timeout=${AI_READ_TIMEOUT:600s}
# Phai lon hon read-timeout cua AI de request khong bi cat truoc khi AI tra loi
spring.mvc.async.request-timeout=${AI_ASYNC_TIMEOUT_MS:660000}

# Import OpenAPI bang file (Module 17 - 2.1): mac dinh cua Spring la 1MB nen spec cua API lon bi tu choi (truoc day tra 500).
# Import tu URL gioi han rieng o SafeUrlFetcher (5MB) - 2 duong cung nang len 20MB cho thong nhat.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
