spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/ai_api_testing_agent?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Gui email OTP cho luong "Quen mat khau" (Module 12) - dien gia tri that vao .env, khong commit
# credential that. Vi du dung Gmail SMTP: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=
# dia chi Gmail, MAIL_PASSWORD=App Password (khong phai mat khau Gmail thuong, phai bat 2-Step
# Verification roi tao App Password rieng). Hoac dung Mailtrap (sandbox, khong gui email that ra
# ngoai, tien loi khi dev/demo) - lay host/port/user/pass tu mailtrap.io.
# Co gia tri mac dinh rong/587 (khac JWT_SECRET/DB_PASSWORD bat buoc) - de app van khoi dong binh
# thuong khi chua cau hinh email, chi that bai LUC GOI sendPasswordResetOtp() neu thieu.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

aes.secret=${AES_SECRET}

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-sonnet-5
spring.ai.anthropic.chat.options.max-tokens=8000

# Quota AI/ngay (Module 11) - tong token toi da 1 user duoc dung trong 1 ngay (UTC) de sinh test
# case, chan SOM truoc khi goi AI (khong ton request nao neu da vuot). 100000 token/ngay du cho
# vai chuc lan sinh binh thuong, nhung chan duoc truong hop 1 user vo tinh/co y sinh lien tuc.
ai.quota.daily-token-limit=100000
spring.ai.retry.max-attempts=3
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s
spring.mvc.async.request-timeout=180000
