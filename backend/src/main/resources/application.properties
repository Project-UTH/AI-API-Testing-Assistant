spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/ai_api_testing_agent?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

aes.secret=${AES_SECRET}

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-sonnet-5
spring.ai.anthropic.chat.options.max-tokens=8000
spring.ai.retry.max-attempts=3
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s
spring.mvc.async.request-timeout=180000
