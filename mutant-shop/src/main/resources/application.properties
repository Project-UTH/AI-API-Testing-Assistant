spring.application.name=mutant-shop
server.port=${SERVER_PORT:8084}

# Chỉ bật điều khiển bộ lỗi khi đo: MUTANT_CONTROL=true
app.mutants.control=${MUTANT_CONTROL:false}

# Auth hoan toan tu code (JwtAuthFilter) - khong dung UserDetailsService mac dinh cua Spring Security.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/shop_mutant?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Chi dung cho project test-target noi bo, khong phai bi mat that - hardcode de tien loi khi
# khoi dong lai app nhieu lan (token cu van con hop le sau restart).
app.jwt.secret=shop-api-target-local-only-secret-key-not-for-production-use-1234567890
app.jwt.expiration-ms=604800000

app.seed.admin-username=admin
app.seed.admin-password=admin123
